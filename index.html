<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>設備管理台帳システム (Firebase版)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDK (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --secondary: #0d9488;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-sub: #475569;
      --border: #cbd5e1;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif; background-color: var(--bg); color: var(--text); padding: 24px; line-height: 1.5; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .header h1 { font-size: 24px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
    .status-badge.online { background: #dcfce7; color: #166534; }
    .status-badge.offline { background: #fee2e2; color: #991b1b; }
    .config-card { background: #fff; padding: 14px 18px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 20px; }
    .config-card summary { font-weight: 600; cursor: pointer; color: var(--primary); }
    .config-card textarea { width: 100%; height: 90px; margin-top: 10px; padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-family: monospace; font-size: 12px; }
    .btn { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--secondary); color: #fff; }
    .btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text); }
    .btn-danger { background: #ef4444; color: #fff; }
    .table-container { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); overflow-x: auto; margin-top: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; white-space: nowrap; }
    th { background: #f1f5f9; padding: 10px 14px; border-bottom: 2px solid var(--border); color: var(--text-sub); }
    td { padding: 10px 14px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
    tr:hover { background-color: #f8fafc; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-box { background: #fff; border-radius: var(--radius); width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; padding: 24px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 4px; }
    .form-group input, .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1><i class="fa-solid fa-server"></i> 設備管理台帳システム</h1>
      <span id="syncBadge" class="status-badge offline" style="margin-top:6px;">
        <i class="fa-solid fa-circle" style="font-size:8px;"></i> 未接続
      </span>
    </div>
    <div>
      <button class="btn btn-secondary" onclick="openModal()"><i class="fa-solid fa-plus"></i> 新規設備登録</button>
    </div>
  </div>

  <details class="config-card" id="configSection">
    <summary><i class="fa-solid fa-gear"></i> Firebase 接続設定 (クリックして展開)</summary>
    <div style="margin-top:10px;">
      <p style="font-size:12px; color:var(--text-sub);">Firebaseコンソールで取得した <code>firebaseConfig</code> のJSON（またはJSオブジェクト）を貼り付けてください：</p>
      <textarea id="configInput" placeholder='{"apiKey": "AIza...", "projectId": "...", ...}'></textarea>
      <div style="margin-top:8px;">
        <button class="btn btn-primary" onclick="saveAndConnectFirebase()"><i class="fa-solid fa-link"></i> 接続して保存</button>
      </div>
    </div>
  </details>

  <div class="table-container">
    <table id="assetTable">
      <thead>
        <tr>
          <th>操作</th><th>No</th><th>分類</th><th>設備名</th><th>識別情報</th><th>設備管理元</th>
          <th>管理場所</th><th>状態</th><th>取扱い方法</th><th>管理者</th><th>管理期間</th>
          <th>返却日</th><th>管理周期</th><th>保護方法</th><th>防護方法</th><th>記録</th><th>備考</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- 登録・編集モーダル -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <h2 id="modalTitle" style="font-size: 18px; color: var(--primary);">設備情報の登録</h2>
      <input type="hidden" id="editDocId">
      <div class="form-grid">
        <div class="form-group"><label>No</label><input type="text" id="f_no"></div>
        <div class="form-group"><label>分類</label><input type="text" id="f_category"></div>
        <div class="form-group"><label>設備名</label><input type="text" id="f_name" required></div>
        <div class="form-group"><label>識別情報(製造番号等)</label><input type="text" id="f_serial"></div>
        <div class="form-group"><label>設備管理元</label><input type="text" id="f_origin"></div>
        <div class="form-group"><label>管理場所</label><input type="text" id="f_location"></div>
        <div class="form-group"><label>設備の状態</label><input type="text" id="f_status"></div>
        <div class="form-group"><label>設備の取扱い方法</label><input type="text" id="f_handling"></div>
        <div class="form-group"><label>管理者</label><input type="text" id="f_manager"></div>
        <div class="form-group"><label>管理期間(申請)</label><input type="text" id="f_period"></div>
        <div class="form-group"><label>返却日</label><input type="text" id="f_return_date"></div>
        <div class="form-group"><label>管理周期</label><input type="text" id="f_cycle"></div>
        <div class="form-group"><label>保護方法</label><input type="text" id="f_protection"></div>
        <div class="form-group"><label>防護方法</label><input type="text" id="f_defense"></div>
        <div class="form-group"><label>記録</label><input type="text" id="f_record"></div>
        <div class="form-group" style="grid-column: 1 / -1;"><label>備考</label><textarea id="f_note" rows="2"></textarea></div>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;">
        <button class="btn btn-outline" onclick="closeModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="submitData()"><i class="fa-solid fa-check"></i> 保存</button>
      </div>
    </div>
  </div>

  <script>
    // ※Configをコードに直書きしたい場合は以下の波括弧内に貼り付けてください
    const EMBEDDED_FIREBASE_CONFIG = null;

    let db = null;
    let assets = [];
    const CONFIG_KEY = 'ledger_firebase_config_raw';

    function init() {
      let config = EMBEDDED_FIREBASE_CONFIG;
      if (!config) {
        const stored = localStorage.getItem(CONFIG_KEY);
        if (stored) {
          try { config = JSON.parse(stored); } catch (e) {}
        }
      }
      if (config) {
        document.getElementById('configInput').value = JSON.stringify(config, null, 2);
        connectFirebase(config);
      }
    }

    function saveAndConnectFirebase() {
      const input = document.getElementById('configInput').value.trim();
      try {
        let jsonStr = input;
        if (!jsonStr.startsWith('{')) {
          jsonStr = jsonStr.substring(jsonStr.indexOf('{'), jsonStr.lastIndexOf('}') + 1);
        }
        // オブジェクトのキーをJSON形式に補正
        jsonStr = jsonStr.replace(/(['"])?([a-zA-Z0-9_]+)(['"])?:/g, '"$2":').replace(/'/g, '"');
        const config = JSON.parse(jsonStr);
        localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
        connectFirebase(config);
      } catch (e) {
        alert("設定の解析に失敗しました。Firebase Config の形式を確認してください。");
      }
    }

    function connectFirebase(config) {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(config);
        }
        db = firebase.firestore();

        // リアルタイムリスナーの登録 (onSnapshot)
        db.collection("assets").orderBy("no", "asc").onSnapshot((snapshot) => {
          assets = [];
          snapshot.forEach((doc) => {
            assets.push({ docId: doc.id, ...doc.data() });
          });
          renderTable();
          updateBadge(true);
        }, (error) => {
          console.error("Firestore同期エラー:", error);
          updateBadge(false);
        });
      } catch (err) {
        console.error("Firebase初期化エラー:", err);
        updateBadge(false);
      }
    }

    function updateBadge(isOnline) {
      const badge = document.getElementById('syncBadge');
      if (isOnline) {
        badge.className = "status-badge online";
        badge.innerHTML = '<i class="fa-solid fa-circle" style="font-size:8px;"></i> クラウド同期中 (リアルタイム)';
      } else {
        badge.className = "status-badge offline";
        badge.innerHTML = '<i class="fa-solid fa-circle" style="font-size:8px;"></i> 未接続';
      }
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      assets.forEach((item) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <button class="btn btn-outline" style="padding:4px 8px; font-size:11px;" onclick="editItem('${item.docId}')"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-danger" style="padding:4px 8px; font-size:11px;" onclick="deleteItem('${item.docId}')"><i class="fa-solid fa-trash"></i></button>
          </td>
          <td>${item.no || ''}</td>
          <td>${item.category || ''}</td>
          <td><strong>${item.name || ''}</strong></td>
          <td>${item.serial || ''}</td>
          <td>${item.origin || ''}</td>
          <td>${item.location || ''}</td>
          <td>${item.status || ''}</td>
          <td>${item.handling || ''}</td>
          <td>${item.manager || ''}</td>
          <td>${item.period || ''}</td>
          <td>${item.return_date || ''}</td>
          <td>${item.cycle || ''}</td>
          <td>${item.protection || ''}</td>
          <td>${item.defense || ''}</td>
          <td>${item.record || ''}</td>
          <td>${item.note || ''}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openModal() {
      document.getElementById('modalTitle').innerText = '設備情報の登録';
      document.getElementById('editDocId').value = '';
      ['no','category','name','serial','origin','location','status','handling','manager','period','return_date','cycle','protection','defense','record','note'].forEach(k => {
        document.getElementById('f_' + k).value = '';
      });
      document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    function editItem(docId) {
      const item = assets.find(a => a.docId === docId);
      if (!item) return;
      document.getElementById('modalTitle').innerText = '設備情報の編集';
      document.getElementById('editDocId').value = item.docId;
      document.getElementById('f_no').value = item.no || '';
      document.getElementById('f_category').value = item.category || '';
      document.getElementById('f_name').value = item.name || '';
      document.getElementById('f_serial').value = item.serial || '';
      document.getElementById('f_origin').value = item.origin || '';
      document.getElementById('f_location').value = item.location || '';
      document.getElementById('f_status').value = item.status || '';
      document.getElementById('f_handling').value = item.handling || '';
      document.getElementById('f_manager').value = item.manager || '';
      document.getElementById('f_period').value = item.period || '';
      document.getElementById('f_return_date').value = item.return_date || '';
      document.getElementById('f_cycle').value = item.cycle || '';
      document.getElementById('f_protection').value = item.protection || '';
      document.getElementById('f_defense').value = item.defense || '';
      document.getElementById('f_record').value = item.record || '';
      document.getElementById('f_note').value = item.note || '';
      document.getElementById('editModal').style.display = 'flex';
    }

    async function submitData() {
      if (!db) {
        alert('Firebase に接続されていません。接続設定を行ってください。');
        return;
      }
      const docId = document.getElementById('editDocId').value;
      const record = {
        no: document.getElementById('f_no').value,
        category: document.getElementById('f_category').value,
        name: document.getElementById('f_name').value,
        serial: document.getElementById('f_serial').value,
        origin: document.getElementById('f_origin').value,
        location: document.getElementById('f_location').value,
        status: document.getElementById('f_status').value,
        handling: document.getElementById('f_handling').value,
        manager: document.getElementById('f_manager').value,
        period: document.getElementById('f_period').value,
        return_date: document.getElementById('f_return_date').value,
        cycle: document.getElementById('f_cycle').value,
        protection: document.getElementById('f_protection').value,
        defense: document.getElementById('f_defense').value,
        record: document.getElementById('f_record').value,
        note: document.getElementById('f_note').value,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        if (docId) {
          await db.collection("assets").doc(docId).update(record);
        } else {
          await db.collection("assets").add(record);
        }
        closeModal();
      } catch (err) {
        alert("保存に失敗しました: " + err.message);
      }
    }

    async function deleteItem(docId) {
      if (!confirm('このデータを削除してもよろしいですか？')) return;
      try {
        await db.collection("assets").doc(docId).delete();
      } catch (err) {
        alert("削除に失敗しました: " + err.message);
      }
    }

    window.onload = init;
  </script>
</body>
</html>
