<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備管理台帳システム</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            700: '#102a43',
                            800: '#0b1b2b',
                            900: '#06101e',
                        },
                        emeraldCustom: {
                            500: '#059669',
                            600: '#047857'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col md:flex-row">

    <!-- サイドバー -->
    <aside class="w-full md:w-64 bg-navy-900 text-white flex-shrink-0 flex flex-col justify-between shadow-xl z-20">
        <div>
            <!-- ロゴ・タイトル -->
            <div class="p-5 border-b border-slate-800 flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-server"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight tracking-wide">設備・資産管理台帳</h1>
                    <p class="text-xs text-slate-400">Equipment Ledger System</p>
                </div>
            </div>

            <!-- ナビゲーションメニュー -->
            <nav class="p-4 space-y-1.5">
                <button onclick="switchTab('list')" id="nav-list" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200 bg-blue-600 text-white shadow-md">
                    <i class="fa-solid fa-table-list w-5 text-center"></i>
                    <span>設備台帳一覧</span>
                </button>
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200 text-slate-300 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-chart-pie w-5 text-center"></i>
                    <span>統計サマリー</span>
                </button>
            </nav>
        </div>

        <!-- サイドバー下部アクション -->
        <div class="p-4 border-t border-slate-800 space-y-2">
            <button onclick="openModal()" class="w-full flex items-center justify-center space-x-2 px-3 py-2.5 bg-emeraldCustom-500 hover:bg-emeraldCustom-600 text-xs font-semibold rounded-lg text-white shadow-md transition">
                <i class="fa-solid fa-plus"></i>
                <span>新規設備を登録</span>
            </button>
            <button onclick="exportCSV()" class="w-full flex items-center justify-center space-x-2 px-3 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-medium rounded-lg text-slate-200 transition">
                <i class="fa-solid fa-file-csv"></i>
                <span>CSVエクスポート</span>
            </button>
            <button onclick="resetSampleData()" class="w-full flex items-center justify-center space-x-2 px-3 py-2 hover:bg-red-900/30 text-red-400 text-xs font-medium rounded-lg transition">
                <i class="fa-solid fa-rotate-left"></i>
                <span>初期データに戻す</span>
            </button>
        </div>
    </aside>

    <!-- メインコンテンツ -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto custom-scrollbar">
        <!-- 上部ヘッダー -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-10 px-6 py-4 flex justify-between items-center shadow-sm">
            <div>
                <h2 id="page-title" class="text-xl font-bold text-navy-700">設備管理台帳 一覧</h2>
                <p id="page-subtitle" class="text-xs text-slate-500">全設備の運用管理および状態確認</p>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg shadow transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-plus"></i>
                    <span>新規追加</span>
                </button>
            </div>
        </header>

        <!-- トースト通知 -->
        <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 z-50 bg-slate-900 text-white px-5 py-3 rounded-lg shadow-2xl flex items-center space-x-3 border-l-4 border-blue-500">
            <i id="toast-icon" class="fa-solid fa-circle-check text-blue-500 text-lg"></i>
            <span id="toast-message" class="text-sm font-medium">メッセージ</span>
        </div>

        <div class="p-6 space-y-6 max-w-[1600px] mx-auto w-full">

            <!-- TAB 1: 設備一覧・検索 (メイン) -->
            <section id="tab-list" class="tab-content space-y-4">
                <!-- 検索・フィルターバー -->
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col lg:flex-row gap-3 justify-between items-center">
                    <!-- 検索ボックス -->
                    <div class="relative w-full lg:w-96">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="searchInput" oninput="filterAssets()" placeholder="キーワード検索（設備名、分類、製造番号、管理者等）..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <!-- フィルター dropdowns -->
                    <div class="flex flex-wrap lg:flex-nowrap gap-2 w-full lg:w-auto">
                        <select id="categoryFilter" onchange="filterAssets()" class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500">
                            <option value="">全分類</option>
                        </select>
                        <select id="statusFilter" onchange="filterAssets()" class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500">
                            <option value="">全設備の状態</option>
                            <option value="使用中">使用中</option>
                            <option value="保管中">保管中</option>
                            <option value="点検・修理中">点検・修理中</option>
                            <option value="返却済み">返却済み</option>
                            <option value="廃棄">廃棄</option>
                        </select>
                        <select id="sortBy" onchange="filterAssets()" class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500">
                            <option value="no-asc">No. (昇順)</option>
                            <option value="no-desc">No. (降順)</option>
                            <option value="name-asc">設備名 (五十音順)</option>
                        </select>
                    </div>
                </div>

                <!-- 台帳テーブル -->
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left text-xs text-slate-700 whitespace-nowrap border-collapse">
                            <thead class="bg-slate-100 text-slate-700 font-bold border-b border-slate-300 uppercase">
                                <tr>
                                    <th class="py-3 px-3 border-r border-slate-200 text-center sticky left-0 bg-slate-100 z-10 min-w-[50px]">No.</th>
                                    <th class="py-3 px-3 border-r border-slate-200 min-w-[120px]">分類</th>
                                    <th class="py-3 px-3 border-r border-slate-200 min-w-[200px]">設備名</th>
                                    <th class="py-3 px-3 border-r border-slate-200 min-w-[160px]">識別情報<br><span class="text-[10px] text-slate-500 font-normal">(製造番号など)</span></th>
                                    <th class="py-3 px-3 border-r border-slate-200 min-w-[100px]">設備管理元</th>
                                    <th class="py-3 px-3 border-r border-slate-200 min-w-[140px]">管理場所</th>
                                    <th class="py-3 px-3 border-r border-slate-200 min-w-[100px]">設備の状態</th>
                                    <th class="py-3 px-3 border-r border-slate-200 min-w-[150px]">設備の取扱い方法</th>
                                    <th class="py-3 px-3 border-r border-slate-200 min-w-[90px]">管理者</th>
                                    <th class="py-3 px-3 border-r border-slate-200 min-w-[160px]">管理期間 (申請)</th>
                                    <th class="py-3 px-3 border-r border-slate-200 min-w-[100px]">返却日</th>
                                    <th class="py-3 px-3 border-r border-slate-200 min-w-[90px]">管理周期</th>
                                    <th class="py-3 px-3 border-r border-slate-200 min-w-[150px]">保護方法</th>
                                    <th class="py-3 px-3 border-r border-slate-200 min-w-[150px]">防護方法</th>
                                    <th class="py-3 px-3 border-r border-slate-200 min-w-[160px]">記録</th>
                                    <th class="py-3 px-3 border-r border-slate-200 min-w-[140px]">備考</th>
                                    <th class="py-3 px-3 text-center sticky right-0 bg-slate-100 z-10 min-w-[80px]">操作</th>
                                </tr>
                            </thead>
                            <tbody id="assetTableBody" class="divide-y divide-slate-200">
                                <!-- JSで動的生成 -->
                            </tbody>
                        </table>
                    </div>
                    <!-- 空メッセージ -->
                    <div id="emptyMessage" class="hidden p-12 text-center text-slate-400">
                        <i class="fa-solid fa-folder-open text-4xl mb-3 text-slate-300"></i>
                        <p class="text-sm font-medium">該当する設備データが見つかりませんでした。</p>
                    </div>
                </div>
            </section>

            <!-- TAB 2: 統計ダッシュボード -->
            <section id="tab-dashboard" class="tab-content hidden space-y-6">
                <!-- KPI カード -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-xl">
                            <i class="fa-solid fa-boxes-stacked"></i>
                        </div>
                        <div>
                            <p class="text-xs font-medium text-slate-500">総登録設備数</p>
                            <h3 id="kpi-total-count" class="text-2xl font-bold text-slate-800">0</h3>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <div>
                            <p class="text-xs font-medium text-slate-500">使用中設備</p>
                            <h3 id="kpi-in-use" class="text-2xl font-bold text-slate-800">0</h3>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl">
                            <i class="fa-solid fa-warehouse"></i>
                        </div>
                        <div>
                            <p class="text-xs font-medium text-slate-500">保管中設備</p>
                            <h3 id="kpi-storage" class="text-2xl font-bold text-slate-800">0</h3>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center text-xl">
                            <i class="fa-solid fa-screwdriver-wrench"></i>
                        </div>
                        <div>
                            <p class="text-xs font-medium text-slate-500">点検・修理中</p>
                            <h3 id="kpi-maintenance" class="text-2xl font-bold text-slate-800">0</h3>
                        </div>
                    </div>
                </div>

                <!-- グラフエリア -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <h4 class="font-bold text-slate-800 mb-4 flex items-center space-x-2">
                            <i class="fa-solid fa-chart-pie text-blue-600"></i>
                            <span>分類別登録内訳</span>
                        </h4>
                        <div class="h-64 relative">
                            <canvas id="categoryChart"></canvas>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <h4 class="font-bold text-slate-800 mb-4 flex items-center space-x-2">
                            <i class="fa-solid fa-chart-bar text-emerald-600"></i>
                            <span>設備状態別 内訳</span>
                        </h4>
                        <div class="h-64 relative">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- 登録・編集モーダル (全16項目対応) -->
    <div id="assetModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto custom-scrollbar flex flex-col">
            <!-- モーダルヘッダー -->
            <div class="p-5 border-b border-slate-200 flex justify-between items-center sticky top-0 bg-white z-10">
                <h3 id="modal-title" class="text-lg font-bold text-navy-700 flex items-center space-x-2">
                    <i class="fa-solid fa-pen-to-square text-blue-600"></i>
                    <span>設備情報の入力</span>
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- 入力フォーム -->
            <form id="assetForm" onsubmit="handleSave(event)" class="p-6 space-y-6 flex-1">
                <input type="hidden" id="edit-original-no">

                <!-- グループ1: 基本情報 -->
                <div class="space-y-3">
                    <h4 class="text-xs font-bold text-blue-600 uppercase tracking-wider border-b border-slate-200 pb-1 flex items-center gap-1.5">
                        <i class="fa-solid fa-info-circle"></i> 基本情報
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">No. <span class="text-red-500">*</span></label>
                            <input type="number" id="form-no" required min="1" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">分類 <span class="text-red-500">*</span></label>
                            <input type="text" id="form-category" required placeholder="例: 開発用PC(大崎オフィス設置)" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">設備名 <span class="text-red-500">*</span></label>
                            <input type="text" id="form-name" required placeholder="例: 【借用端末】NEC PC-VJ20EXZCB" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- グループ2: 識別・管理場所 -->
                <div class="space-y-3">
                    <h4 class="text-xs font-bold text-blue-600 uppercase tracking-wider border-b border-slate-200 pb-1 flex items-center gap-1.5">
                        <i class="fa-solid fa-location-dot"></i> 識別・設置場所・取扱
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">識別情報 (製造番号など)</label>
                            <textarea id="form-identifier" rows="2" placeholder="例: JRI物件：502034210" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">管理場所</label>
                            <textarea id="form-location" rows="2" placeholder="例: 大崎フォレストビルディング" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">設備管理元</label>
                            <input type="text" id="form-provider" placeholder="例: JRI, NTTD, FCS" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">設備の状態 <span class="text-red-500">*</span></label>
                            <select id="form-status" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                                <option value="使用中">使用中</option>
                                <option value="保管中">保管中</option>
                                <option value="点検・修理中">点検・修理中</option>
                                <option value="返却済み">返却済み</option>
                                <option value="廃棄">廃棄</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-semibold text-slate-700 mb-1">設備の取扱い方法</label>
                            <input type="text" id="form-usage" placeholder="例: 顧客及び自社の規定に従う" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- グループ3: 設備の運用管理 -->
                <div class="space-y-3">
                    <h4 class="text-xs font-bold text-blue-600 uppercase tracking-wider border-b border-slate-200 pb-1 flex items-center gap-1.5">
                        <i class="fa-solid fa-list-check"></i> 設備の運用管理
                    </h4>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">管理者</label>
                            <input type="text" id="form-manager" placeholder="例: 岡部" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">管理期間 (申請)</label>
                            <input type="text" id="form-period" placeholder="例: 2022/4/1 ～ 2026/3/31" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">返却日</label>
                            <input type="text" id="form-return-date" placeholder="例: 2026/3/31" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">管理周期</label>
                            <input type="text" id="form-cycle" placeholder="例: 月1回" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">保護方法</label>
                            <input type="text" id="form-protection" placeholder="例: ユーザ ID、パスワード設定" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">防護方法</label>
                            <input type="text" id="form-safeguard" placeholder="例: 集約ラックにて施錠管理" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div class="md:col-span-3">
                            <label class="block text-xs font-semibold text-slate-700 mb-1">記録</label>
                            <textarea id="form-record" rows="2" placeholder="例: 安全対策チェックリスト / 情報セキュリティチェックリスト" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                        </div>
                    </div>
                </div>

                <!-- グループ4: 備考 -->
                <div class="space-y-3">
                    <h4 class="text-xs font-bold text-blue-600 uppercase tracking-wider border-b border-slate-200 pb-1 flex items-center gap-1.5">
                        <i class="fa-solid fa-comment-dots"></i> 備考
                    </h4>
                    <div>
                        <textarea id="form-remarks" rows="2" placeholder="例: ノートPC、リモート接続で自席から使用 など" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                    </div>
                </div>

                <!-- フッターボタン -->
                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-200">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-lg text-sm font-medium border border-slate-300 hover:bg-slate-50 transition">キャンセル</button>
                    <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium shadow-md transition flex items-center space-x-2">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>保存する</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // フォーマット画像のサンプルデータをプリセット
        const SAMPLE_ASSETS = [
            {
                no: 1,
                category: "開発用PC(大崎オフィス設置)",
                name: "【借用端末(NTTデータシステム技術)】NEC PC-VJ20EXZCB",
                identifier: "JRI物件：502034210",
                provider: "JRI",
                location: "大崎フォレストビルディング",
                status: "使用中",
                usage: "顧客及び自社の規定に従う",
                manager: "岡部",
                period: "2022/4/1 ～ 2026/3/31",
                returnDate: "",
                cycle: "月1回",
                protection: "ユーザ ID、パスワード設定",
                safeguard: "集約ラックにて施錠管理",
                record: "安全対策チェックリスト\n情報セキュリティチェックリスト",
                remarks: "ノートPC\nリモート接続で自席から使用"
            },
            {
                no: 2,
                category: "NOAシンクライアント端末(在宅勤務用)",
                name: "【借用シンクライアント端末(NTTデータシステム技術)】HP PROBOOK",
                identifier: "シリアル No:#5CD101CPFX\n整理 No:M323-53",
                provider: "NTTD",
                location: "大崎フォレストビルディング\n自宅",
                status: "使用中",
                usage: "顧客及び自社の規定に従う",
                manager: "岡部",
                period: "2022/4/1 ～ 2026/3/31",
                returnDate: "",
                cycle: "月1回",
                protection: "ユーザ ID、パスワード設定",
                safeguard: "自席、自宅書棚、社用カバン内にて管理",
                record: "安全対策チェックリスト\n情報セキュリティチェックリスト",
                remarks: "ノートPC"
            },
            {
                no: 3,
                category: "その他",
                name: "【借用品(FCS)】マウス",
                identifier: "1831LZ06WSB8",
                provider: "FCS",
                location: "大崎フォレストビルディング\n自宅",
                status: "使用中",
                usage: "自社の規定に従う",
                manager: "岡部",
                period: "2022/4/1 ～ 2026/3/31",
                returnDate: "",
                cycle: "月1回",
                protection: "存在確認",
                safeguard: "自席、自宅書棚、社用カバン内にて管理",
                record: "安全対策チェックリスト\n情報セキュリティチェックリスト",
                remarks: "赤"
            }
        ];

        let assets = [];
        let categoryChartInst = null;
        let statusChartInst = null;

        // 初期化ロード
        window.onload = function() {
            loadAssets();
            updateCategoryFilterOptions();
            renderTable();
            renderDashboard();
        };

        // ローカルストレージ読み込み
        function loadAssets() {
            const saved = localStorage.getItem('equipment_ledger_data');
            if (saved) {
                try {
                    assets = JSON.parse(saved);
                } catch(e) {
                    assets = JSON.parse(JSON.stringify(SAMPLE_ASSETS));
                }
            } else {
                assets = JSON.parse(JSON.stringify(SAMPLE_ASSETS));
                saveAssets();
            }
        }

        // 保存
        function saveAssets() {
            localStorage.setItem('equipment_ledger_data', JSON.stringify(assets));
            updateCategoryFilterOptions();
            filterAssets();
            renderDashboard();
        }

        // 分類フィルタードロップダウンの動的更新
        function updateCategoryFilterOptions() {
            const select = document.getElementById('categoryFilter');
            const currentVal = select.value;
            const categories = [...new Set(assets.map(a => a.category).filter(Boolean))];

            select.innerHTML = '<option value="">全分類</option>';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
            select.value = currentVal;
        }

        // タブ切り替え
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'shadow-md');
                btn.classList.add('text-slate-300');
            });

            const targetTab = document.getElementById(`tab-${tabName}`);
            const targetNav = document.getElementById(`nav-${tabName}`);

            if (targetTab && targetNav) {
                targetTab.classList.remove('hidden');
                targetNav.classList.add('bg-blue-600', 'text-white', 'shadow-md');
                targetNav.classList.remove('text-slate-300');
            }

            const titleMap = {
                'list': ['設備管理台帳 一覧', '全設備の運用管理および状態確認'],
                'dashboard': ['統計サマリー', '登録設備データのグラフィカル表示']
            };
            if(titleMap[tabName]) {
                document.getElementById('page-title').innerText = titleMap[tabName][0];
                document.getElementById('page-subtitle').innerText = titleMap[tabName][1];
            }

            if(tabName === 'dashboard') {
                renderDashboard();
            }
        }

        // テーブル描画＆フィルター
        function filterAssets() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const status = document.getElementById('statusFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            let filtered = assets.filter(item => {
                const searchStr = `${item.no} ${item.category} ${item.name} ${item.identifier} ${item.provider} ${item.location} ${item.manager} ${item.remarks}`.toLowerCase();
                const matchKeyword = !keyword || searchStr.includes(keyword);
                const matchCategory = !category || item.category === category;
                const matchStatus = !status || item.status === status;

                return matchKeyword && matchCategory && matchStatus;
            });

            filtered.sort((a, b) => {
                if (sortBy === 'no-asc') return Number(a.no) - Number(b.no);
                if (sortBy === 'no-desc') return Number(b.no) - Number(a.no);
                if (sortBy === 'name-asc') return (a.name || '').localeCompare(b.name || '', 'ja');
                return 0;
            });

            renderTable(filtered);
        }

        function renderTable(data = assets) {
            const tbody = document.getElementById('assetTableBody');
            const emptyMsg = document.getElementById('emptyMessage');
            tbody.innerHTML = '';

            if (data.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            } else {
                emptyMsg.classList.add('hidden');
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-blue-50/50 transition border-b border-slate-200";

                // ステータスバッジ
                let statusBadge = "bg-slate-100 text-slate-700";
                if (item.status === '使用中') statusBadge = "bg-emerald-100 text-emerald-800";
                if (item.status === '保管中') statusBadge = "bg-blue-100 text-blue-800";
                if (item.status === '点検・修理中') statusBadge = "bg-amber-100 text-amber-800";
                if (item.status === '返却済み') statusBadge = "bg-purple-100 text-purple-800";

                tr.innerHTML = `
                    <td class="py-3 px-3 border-r border-slate-200 text-center font-semibold text-slate-900 sticky left-0 bg-white z-10">${escapeHtml(item.no)}</td>
                    <td class="py-3 px-3 border-r border-slate-200 font-medium">${formatMultiline(item.category)}</td>
                    <td class="py-3 px-3 border-r border-slate-200 font-bold text-slate-900">${formatMultiline(item.name)}</td>
                    <td class="py-3 px-3 border-r border-slate-200 text-slate-600 font-mono text-[11px]">${formatMultiline(item.identifier)}</td>
                    <td class="py-3 px-3 border-r border-slate-200 text-center font-medium">${escapeHtml(item.provider || '-')}</td>
                    <td class="py-3 px-3 border-r border-slate-200">${formatMultiline(item.location)}</td>
                    <td class="py-3 px-3 border-r border-slate-200 text-center">
                        <span class="inline-block px-2 py-0.5 text-[11px] rounded-full font-semibold ${statusBadge}">${escapeHtml(item.status)}</span>
                    </td>
                    <td class="py-3 px-3 border-r border-slate-200">${formatMultiline(item.usage)}</td>
                    <td class="py-3 px-3 border-r border-slate-200 text-center">${escapeHtml(item.manager || '-')}</td>
                    <td class="py-3 px-3 border-r border-slate-200 text-slate-600">${escapeHtml(item.period || '-')}</td>
                    <td class="py-3 px-3 border-r border-slate-200 text-center">${escapeHtml(item.returnDate || '-')}</td>
                    <td class="py-3 px-3 border-r border-slate-200 text-center">${escapeHtml(item.cycle || '-')}</td>
                    <td class="py-3 px-3 border-r border-slate-200">${formatMultiline(item.protection)}</td>
                    <td class="py-3 px-3 border-r border-slate-200">${formatMultiline(item.safeguard)}</td>
                    <td class="py-3 px-3 border-r border-slate-200">${formatMultiline(item.record)}</td>
                    <td class="py-3 px-3 border-r border-slate-200 text-slate-600">${formatMultiline(item.remarks)}</td>
                    <td class="py-3 px-3 text-center sticky right-0 bg-white z-10 space-x-1">
                        <button onclick="openModal(${item.no})" class="text-blue-600 hover:text-blue-800 p-1.5 rounded hover:bg-blue-100 transition" title="編集">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button onclick="deleteAsset(${item.no})" class="text-red-500 hover:text-red-700 p-1.5 rounded hover:bg-red-100 transition" title="削除">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // モーダル開閉
        function openModal(no = null) {
            const form = document.getElementById('assetForm');
            form.reset();

            if (no !== null) {
                // 編集モード
                const item = assets.find(a => Number(a.no) === Number(no));
                if (!item) return;

                document.getElementById('modal-title').innerText = `設備情報の編集 (No.${item.no})`;
                document.getElementById('edit-original-no').value = item.no;
                document.getElementById('form-no').value = item.no;
                document.getElementById('form-category').value = item.category || '';
                document.getElementById('form-name').value = item.name || '';
                document.getElementById('form-identifier').value = item.identifier || '';
                document.getElementById('form-provider').value = item.provider || '';
                document.getElementById('form-location').value = item.location || '';
                document.getElementById('form-status').value = item.status || '使用中';
                document.getElementById('form-usage').value = item.usage || '';
                document.getElementById('form-manager').value = item.manager || '';
                document.getElementById('form-period').value = item.period || '';
                document.getElementById('form-return-date').value = item.returnDate || '';
                document.getElementById('form-cycle').value = item.cycle || '';
                document.getElementById('form-protection').value = item.protection || '';
                document.getElementById('form-safeguard').value = item.safeguard || '';
                document.getElementById('form-record').value = item.record || '';
                document.getElementById('form-remarks').value = item.remarks || '';
            } else {
                // 新規モード (Noを自動生成)
                document.getElementById('modal-title').innerText = "設備の新規登録";
                document.getElementById('edit-original-no').value = "";
                const nextNo = assets.length > 0 ? Math.max(...assets.map(a => Number(a.no) || 0)) + 1 : 1;
                document.getElementById('form-no').value = nextNo;
            }

            document.getElementById('assetModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('assetModal').classList.add('hidden');
        }

        // 保存処理 (新規 or 編集)
        function handleSave(e) {
            e.preventDefault();
            const originalNo = document.getElementById('edit-original-no').value;
            const newNo = Number(document.getElementById('form-no').value);

            // 重複チェック
            if (originalNo === "" || Number(originalNo) !== newNo) {
                if (assets.some(a => Number(a.no) === newNo)) {
                    showToast(`No.${newNo} は既に登録されています。別のNoを指定してください。`, true);
                    return;
                }
            }

            const formData = {
                no: newNo,
                category: document.getElementById('form-category').value,
                name: document.getElementById('form-name').value,
                identifier: document.getElementById('form-identifier').value,
                provider: document.getElementById('form-provider').value,
                location: document.getElementById('form-location').value,
                status: document.getElementById('form-status').value,
                usage: document.getElementById('form-usage').value,
                manager: document.getElementById('form-manager').value,
                period: document.getElementById('form-period').value,
                returnDate: document.getElementById('form-return-date').value,
                cycle: document.getElementById('form-cycle').value,
                protection: document.getElementById('form-protection').value,
                safeguard: document.getElementById('form-safeguard').value,
                record: document.getElementById('form-record').value,
                remarks: document.getElementById('form-remarks').value
            };

            if (originalNo !== "") {
                // 更新
                const idx = assets.findIndex(a => Number(a.no) === Number(originalNo));
                if (idx !== -1) assets[idx] = formData;
                showToast(`No.${newNo} の設備情報を更新しました`);
            } else {
                // 新規追加
                assets.push(formData);
                showToast(`No.${newNo} の設備を登録しました`);
            }

            saveAssets();
            closeModal();
        }

        // 削除
        function deleteAsset(no) {
            if (confirm(`No.${no} の設備データを削除しますか？`)) {
                assets = assets.filter(a => Number(a.no) !== Number(no));
                saveAssets();
                showToast(`No.${no} を削除しました`);
            }
        }

        // ダッシュボード統計更新
        function renderDashboard() {
            document.getElementById('kpi-total-count').innerText = assets.length + ' 件';
            document.getElementById('kpi-in-use').innerText = assets.filter(a => a.status === '使用中').length + ' 件';
            document.getElementById('kpi-storage').innerText = assets.filter(a => a.status === '保管中').length + ' 件';
            document.getElementById('kpi-maintenance').innerText = assets.filter(a => a.status === '点検・修理中').length + ' 件';

            // 分類別
            const catMap = {};
            assets.forEach(a => {
                const cat = a.category || '未設定';
                catMap[cat] = (catMap[cat] || 0) + 1;
            });

            const ctxCat = document.getElementById('categoryChart').getContext('2d');
            if (categoryChartInst) categoryChartInst.destroy();
            categoryChartInst = new Chart(ctxCat, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catMap),
                    datasets: [{
                        data: Object.values(catMap),
                        backgroundColor: ['#2563eb', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#64748b']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // 状態別
            const statuses = ['使用中', '保管中', '点検・修理中', '返却済み', '廃棄'];
            const statusCounts = statuses.map(s => assets.filter(a => a.status === s).length);

            const ctxStat = document.getElementById('statusChart').getContext('2d');
            if (statusChartInst) statusChartInst.destroy();
            statusChartInst = new Chart(ctxStat, {
                type: 'bar',
                data: {
                    labels: statuses,
                    datasets: [{
                        label: '設備数',
                        data: statusCounts,
                        backgroundColor: ['#10b981', '#2563eb', '#f59e0b', '#a855f7', '#ef4444']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
        }

        // CSVエクスポート
        function exportCSV() {
            if (assets.length === 0) {
                showToast("出力対象のデータがありません", true);
                return;
            }

            const headers = [
                "No.", "分類", "設備名", "識別情報（製造番号など）", "設備管理元", "管理場所",
                "設備の状態", "設備の取扱い方法", "管理者", "管理期間（申請）", "返却日",
                "管理周期", "保護方法", "防護方法", "記録", "備考"
            ];

            const rows = assets.map(a => [
                a.no, a.category, a.name, a.identifier, a.provider, a.location,
                a.status, a.usage, a.manager, a.period, a.returnDate,
                a.cycle, a.protection, a.safeguard, a.record, a.remarks
            ].map(val => `"${String(val || '').replace(/"/g, '""')}"`));

            const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `設備管理台帳_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("CSVファイルを出力しました");
        }

        // 初期データに戻す
        function resetSampleData() {
            if (confirm("フォーマット画像の初期サンプルデータに戻しますか？（追加・更新した内容はリセットされます）")) {
                assets = JSON.parse(JSON.stringify(SAMPLE_ASSETS));
                saveAssets();
                showToast("初期サンプルデータに戻しました");
            }
        }

        // トースト通知
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = message;
            if (isError) {
                toast.classList.remove('border-blue-500');
                toast.classList.add('border-red-500');
                toastIcon.className = "fa-solid fa-circle-exclamation text-red-500 text-lg";
            } else {
                toast.classList.remove('border-red-500');
                toast.classList.add('border-blue-500');
                toastIcon.className = "fa-solid fa-circle-check text-blue-500 text-lg";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // エスケープ＆改行表示ヘルパー
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function formatMultiline(str) {
            if (!str) return '-';
            return escapeHtml(str).replace(/\n/g, '<br>');
        }
    </script>
</body>
